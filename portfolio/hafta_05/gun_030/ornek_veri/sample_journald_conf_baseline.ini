# /etc/systemd/journald.conf - Kurumsal Güvenlik ve Kalıcılık Referans Dosyası

[Journal]
# Kalıcılık Politikası: volatile (yalnızca RAM) yerine persistent (diske kalıcı yazım)
Storage=persistent

# Günlüklerin sıkıştırılması (Disk tasarrufu)
Compress=yes

# Kriptografik FSS (Forward Secure Sealing) mühürleme
Seal=yes

# Kullanıcı başına günlük ayrımı
SplitMode=uid

# Günlüklerin senkronizasyon aralığı
SyncIntervalSec=5m

# Hız sınırlama (Log flooding DoS koruması)
RateLimitIntervalSec=30s
RateLimitBurst=10000

# Disk kota sınırları
SystemMaxUse=4G
SystemKeepFree=1G
SystemMaxFileSize=128M

# Geleneksel syslog iletimi
ForwardToSyslog=no

# Günlük saklama süresi
MaxRetentionSec=1month
